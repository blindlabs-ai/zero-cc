<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="zero-cc Direct ELF64 AVX2 vs rustc -O3 latency on 6 zero-rans kernels">
  <defs>
    <linearGradient id="gZcc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D48A"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>
    <linearGradient id="gRust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { fill: #F8FAFC; font-size: 18px; font-weight: 700; }
      .sub { fill: #94A3B8; font-size: 11px; }
      .winSum { fill: #00F5A0; font-size: 11px; font-weight: 700; text-anchor: end; }
      .kname { fill: #E2E8F0; font-size: 12.5px; font-weight: 700; }
      .kmeta { fill: #64748B; font-size: 10.5px; }
      .valR { fill: #7DD3FC; font-size: 11px; font-weight: 600; }
      .valZ { fill: #34D399; font-size: 11px; font-weight: 700; }
      .tick { fill: #64748B; font-size: 10.5px; text-anchor: middle; }
      .badgeWin { fill: #00F5A0; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .pill { fill: #CBD5E1; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
      .foot { fill: #64748B; font-size: 10px; }
    </style>
  </defs>

  <rect width="980" height="560" fill="#07090E"/>
  <rect x="16" y="16" width="948" height="528" rx="14" fill="#0F141F" stroke="#1E293B" stroke-width="1.5"/>

  <text x="36" y="44" class="mono title">zero-cc Direct ELF64 (AVX2) vs rustc -O3 on zero-rans Kernels</text>
  <text x="36" y="65" class="mono sub">AMD Ryzen 9 3900X | rustc 1.91.0 -C opt-level=3 | 131,072 calls/trial (median of 9) | Lower ns/call is faster</text>

  <rect x="36" y="77" width="12" height="12" rx="2" fill="url(#gZcc)"/>
  <text x="54" y="87" class="mono sub">zero-cc Direct ELF64 (AVX2)</text>
  <rect x="276" y="77" width="12" height="12" rx="2" fill="url(#gRust)"/>
  <text x="294" y="87" class="mono sub">rustc -O3 (LLVM)</text>
  <text x="944" y="87" class="mono winSum">6/6 kernels faster (1.12x - 2.57x)</text>

  <line x1="36" y1="100" x2="944" y2="100" stroke="#1E293B" stroke-width="1"/>

  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3,4">
    <line x1="250" y1="112" x2="250" y2="458"/>
    <line x1="350" y1="112" x2="350" y2="458"/>
    <line x1="450" y1="112" x2="450" y2="458"/>
    <line x1="550" y1="112" x2="550" y2="458"/>
    <line x1="650" y1="112" x2="650" y2="458"/>
    <line x1="750" y1="112" x2="750" y2="458"/>
  </g>
  <line x1="250" y1="112" x2="250" y2="458" stroke="#334155" stroke-width="1.5"/>

  <!-- Row 0: idct8_1d_combine -->
  <text x="36" y="134" class="mono kname">idct8_1d_combine</text>
  <text x="36" y="150" class="mono kmeta">165-&gt;17 ops | AVX2 4x64</text>
  <rect x="250" y="120" width="407.0" height="14" rx="3" fill="url(#gRust)"/>
  <text x="665" y="131" class="mono valR">8.14 ns</text>
  <rect x="250" y="138" width="158.5" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="417" y="149" class="mono valZ">3.17 ns</text>
  <rect x="816" y="123" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="140" class="mono badgeWin">2.57x faster</text>

  <!-- Row 1: dct8_1d_odd -->
  <text x="36" y="190" class="mono kname">dct8_1d_odd</text>
  <text x="36" y="206" class="mono kmeta">93-&gt;53 ops | AVX2 4x64</text>
  <rect x="250" y="176" width="295.0" height="14" rx="3" fill="url(#gRust)"/>
  <text x="553" y="187" class="mono valR">5.90 ns</text>
  <rect x="250" y="194" width="144.5" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="403" y="205" class="mono valZ">2.89 ns</text>
  <rect x="816" y="179" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="196" class="mono badgeWin">2.04x faster</text>

  <!-- Row 2: idct8_1d_odd -->
  <text x="36" y="246" class="mono kname">idct8_1d_odd</text>
  <text x="36" y="262" class="mono kmeta">93-&gt;71 ops | /289 AVX2</text>
  <rect x="250" y="232" width="320.5" height="14" rx="3" fill="url(#gRust)"/>
  <text x="579" y="243" class="mono valR">6.41 ns</text>
  <rect x="250" y="250" width="165.0" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="423" y="261" class="mono valZ">3.30 ns</text>
  <rect x="816" y="235" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="252" class="mono badgeWin">1.94x faster</text>

  <!-- Row 3: idct8_1d_even -->
  <text x="36" y="302" class="mono kname">idct8_1d_even</text>
  <text x="36" y="318" class="mono kmeta">49-&gt;37 ops | /29 AVX2</text>
  <rect x="250" y="288" width="181.0" height="14" rx="3" fill="url(#gRust)"/>
  <text x="439" y="299" class="mono valR">3.62 ns</text>
  <rect x="250" y="306" width="113.0" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="371" y="317" class="mono valZ">2.26 ns</text>
  <rect x="816" y="291" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="308" class="mono badgeWin">1.60x faster</text>

  <!-- Row 4: dct8_1d_even -->
  <text x="36" y="358" class="mono kname">dct8_1d_even</text>
  <text x="36" y="374" class="mono kmeta">69-&gt;31 ops | AVX2 4x64</text>
  <rect x="250" y="344" width="210.5" height="14" rx="3" fill="url(#gRust)"/>
  <text x="469" y="355" class="mono valR">4.21 ns</text>
  <rect x="250" y="362" width="137.5" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="396" y="373" class="mono valZ">2.75 ns</text>
  <rect x="816" y="347" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="364" class="mono badgeWin">1.53x faster</text>

  <!-- Row 5: rans_renorm_branchless -->
  <text x="36" y="414" class="mono kname">rans_renorm_branchless</text>
  <text x="36" y="430" class="mono kmeta">137-&gt;58 ops | AVX2 8x32</text>
  <rect x="250" y="400" width="151.5" height="14" rx="3" fill="url(#gRust)"/>
  <text x="410" y="411" class="mono valR">3.03 ns</text>
  <rect x="250" y="418" width="135.0" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="393" y="429" class="mono valZ">2.70 ns</text>
  <rect x="816" y="403" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="420" class="mono badgeWin">1.12x faster</text>

  <!-- X-axis ticks -->
  <text x="250" y="474" class="mono tick">0 ns</text>
  <text x="350" y="474" class="mono tick">2 ns</text>
  <text x="450" y="474" class="mono tick">4 ns</text>
  <text x="550" y="474" class="mono tick">6 ns</text>
  <text x="650" y="474" class="mono tick">8 ns</text>
  <text x="750" y="474" class="mono tick">10 ns</text>

  <!-- Footer Verification Badges -->
  <line x1="36" y1="486" x2="944" y2="486" stroke="#1E293B" stroke-width="1"/>
  <rect x="36" y="494" width="144" height="22" rx="5" fill="#111827" stroke="#334155"/>
  <text x="108" y="509" class="mono pill">0 idiv / 0 spills</text>
  <rect x="190" y="494" width="196" height="22" rx="5" fill="#111827" stroke="#00F5A0"/>
  <text x="288" y="509" class="mono pill">100.0% Direct ET_EXEC</text>
  <rect x="396" y="494" width="174" height="22" rx="5" fill="#111827" stroke="#334155"/>
  <text x="483" y="509" class="mono pill">4,096-block bit-exact</text>
  <rect x="580" y="494" width="214" height="22" rx="5" fill="#111827" stroke="#334155"/>
  <text x="687" y="509" class="mono pill">25/26 crate kernels (23.2ms)</text>
  <rect x="804" y="494" width="140" height="22" rx="5" fill="#111827" stroke="#334155"/>
  <text x="874" y="509" class="mono pill">0 external crates</text>

  <text x="36" y="532" class="mono foot">All 6 kernels compile straight from unmodified zero-rans .rs to AVX2 ELF64 (8x32 horizontal + 4x64 vertical + 4x4 transpose, 0 spills).</text>
</svg>
