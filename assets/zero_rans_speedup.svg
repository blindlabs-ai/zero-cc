<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="zero-cc Direct ELF64 vs rustc -O3 latency on 6 zero-rans kernels">
  <defs>
    <linearGradient id="gZcc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D48A"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>
    <linearGradient id="gRust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { fill: #F8FAFC; font-size: 19px; font-weight: 700; }
      .sub { fill: #94A3B8; font-size: 11.5px; }
      .kname { fill: #E2E8F0; font-size: 12.5px; font-weight: 700; }
      .kmeta { fill: #64748B; font-size: 10.5px; }
      .valR { fill: #7DD3FC; font-size: 11px; font-weight: 600; }
      .valZ { fill: #34D399; font-size: 11px; font-weight: 700; }
      .valW { fill: #FBBF24; font-size: 11px; font-weight: 700; }
      .tick { fill: #64748B; font-size: 10.5px; text-anchor: middle; }
      .badgeWin { fill: #00F5A0; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .badgeNeu { fill: #F59E0B; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .pill { fill: #CBD5E1; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
      .foot { fill: #64748B; font-size: 10px; }
    </style>
  </defs>

  <rect width="980" height="540" fill="#07090E"/>
  <rect x="16" y="16" width="948" height="508" rx="14" fill="#0F141F" stroke="#1E293B" stroke-width="1.5"/>

  <text x="36" y="48" class="mono title">zero-cc Direct ELF64 vs rustc -O3 (LLVM) on zero-rans Kernels</text>
  <text x="36" y="69" class="mono sub">AMD Ryzen 9 3900X | rustc 1.91.0 -C opt-level=3 | 131,072 calls/trial (median of 9) | Lower ns/call is faster</text>

  <rect x="628" y="34" width="12" height="12" rx="2" fill="url(#gZcc)"/>
  <text x="646" y="44" class="mono sub">zero-cc Direct ELF64</text>
  <rect x="802" y="34" width="12" height="12" rx="2" fill="url(#gRust)"/>
  <text x="820" y="44" class="mono sub">rustc -O3 (LLVM)</text>

  <line x1="36" y1="86" x2="944" y2="86" stroke="#1E293B" stroke-width="1"/>

  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3,4">
    <line x1="250" y1="98" x2="250" y2="444"/>
    <line x1="334.6" y1="98" x2="334.6" y2="444"/>
    <line x1="419.2" y1="98" x2="419.2" y2="444"/>
    <line x1="503.8" y1="98" x2="503.8" y2="444"/>
    <line x1="588.5" y1="98" x2="588.5" y2="444"/>
    <line x1="673.1" y1="98" x2="673.1" y2="444"/>
    <line x1="757.7" y1="98" x2="757.7" y2="444"/>
  </g>
  <line x1="250" y1="98" x2="250" y2="444" stroke="#334155" stroke-width="1.5"/>

  <!-- Row 0: idct8_1d_combine -->
  <text x="36" y="120" class="mono kname">idct8_1d_combine</text>
  <text x="36" y="136" class="mono kmeta">165-&gt;17 ops | guards dead</text>
  <rect x="250" y="106" width="372.5" height="14" rx="3" fill="url(#gRust)"/>
  <text x="630" y="117" class="mono valR">8.81 ns</text>
  <rect x="250" y="124" width="85.9" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="344" y="135" class="mono valZ">2.03 ns</text>
  <rect x="816" y="109" width="126" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="879" y="126" class="mono badgeWin">4.34x faster</text>

  <!-- Row 1: dct8_1d_even -->
  <text x="36" y="176" class="mono kname">dct8_1d_even</text>
  <text x="36" y="192" class="mono kmeta">69-&gt;31 ops | clamps dead</text>
  <rect x="250" y="162" width="184.0" height="14" rx="3" fill="url(#gRust)"/>
  <text x="442" y="173" class="mono valR">4.35 ns</text>
  <rect x="250" y="180" width="129.8" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="388" y="191" class="mono valZ">3.07 ns</text>
  <rect x="816" y="165" width="126" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="879" y="182" class="mono badgeWin">1.42x faster</text>

  <!-- Row 2: dct8_1d_odd -->
  <text x="36" y="232" class="mono kname">dct8_1d_odd</text>
  <text x="36" y="248" class="mono kmeta">93-&gt;53 ops | clamps dead</text>
  <rect x="250" y="218" width="258.8" height="14" rx="3" fill="url(#gRust)"/>
  <text x="517" y="229" class="mono valR">6.12 ns</text>
  <rect x="250" y="236" width="221.9" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="480" y="247" class="mono valZ">5.25 ns</text>
  <rect x="816" y="221" width="126" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="879" y="238" class="mono badgeWin">1.17x faster</text>

  <!-- Row 3: idct8_1d_odd -->
  <text x="36" y="288" class="mono kname">idct8_1d_odd</text>
  <text x="36" y="304" class="mono kmeta">93-&gt;71 ops | /289 Barrett</text>
  <rect x="250" y="274" width="269.8" height="14" rx="3" fill="url(#gRust)"/>
  <text x="528" y="285" class="mono valR">6.38 ns</text>
  <rect x="250" y="292" width="298.7" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="557" y="303" class="mono valW">7.06 ns</text>
  <rect x="816" y="277" width="126" height="26" rx="6" fill="#1E1B14" stroke="#F59E0B" stroke-width="1"/>
  <text x="879" y="294" class="mono badgeNeu">0.90x scalar*</text>

  <!-- Row 4: idct8_1d_even -->
  <text x="36" y="344" class="mono kname">idct8_1d_even</text>
  <text x="36" y="360" class="mono kmeta">49-&gt;37 ops | /29 Barrett</text>
  <rect x="250" y="330" width="139.4" height="14" rx="3" fill="url(#gRust)"/>
  <text x="397" y="341" class="mono valR">3.29 ns</text>
  <rect x="250" y="348" width="157.2" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="415" y="359" class="mono valW">3.72 ns</text>
  <rect x="816" y="333" width="126" height="26" rx="6" fill="#1E1B14" stroke="#F59E0B" stroke-width="1"/>
  <text x="879" y="350" class="mono badgeNeu">0.89x scalar*</text>

  <!-- Row 5: rans_renorm_branchless -->
  <text x="36" y="400" class="mono kname">rans_renorm_branchless</text>
  <text x="36" y="416" class="mono kmeta">137-&gt;68 ops | u32/u16 GPR*</text>
  <rect x="250" y="386" width="121.0" height="14" rx="3" fill="url(#gRust)"/>
  <text x="379" y="397" class="mono valR">2.86 ns</text>
  <rect x="250" y="404" width="459.4" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="717" y="415" class="mono valW">10.86 ns</text>
  <rect x="816" y="389" width="126" height="26" rx="6" fill="#1E1B14" stroke="#F59E0B" stroke-width="1"/>
  <text x="879" y="406" class="mono badgeNeu">0.26x scalar*</text>

  <!-- X-axis ticks -->
  <text x="250" y="460" class="mono tick">0 ns</text>
  <text x="334.6" y="460" class="mono tick">2 ns</text>
  <text x="419.2" y="460" class="mono tick">4 ns</text>
  <text x="503.8" y="460" class="mono tick">6 ns</text>
  <text x="588.5" y="460" class="mono tick">8 ns</text>
  <text x="673.1" y="460" class="mono tick">10 ns</text>
  <text x="757.7" y="460" class="mono tick">12 ns</text>

  <!-- Footer Verification Badges -->
  <line x1="36" y1="471" x2="944" y2="471" stroke="#1E293B" stroke-width="1"/>
  <rect x="36" y="479" width="144" height="22" rx="5" fill="#111827" stroke="#334155"/>
  <text x="108" y="494" class="mono pill">0 idiv / 0 spills</text>
  <rect x="190" y="479" width="196" height="22" rx="5" fill="#111827" stroke="#00F5A0"/>
  <text x="288" y="494" class="mono pill">100.0% Direct ET_EXEC</text>
  <rect x="396" y="479" width="174" height="22" rx="5" fill="#111827" stroke="#334155"/>
  <text x="483" y="494" class="mono pill">4,096-block bit-exact</text>
  <rect x="580" y="479" width="214" height="22" rx="5" fill="#111827" stroke="#334155"/>
  <text x="687" y="494" class="mono pill">25/26 crate kernels (22.8ms)</text>
  <rect x="804" y="479" width="140" height="22" rx="5" fill="#111827" stroke="#334155"/>
  <text x="874" y="494" class="mono pill">0 external crates</text>

  <text x="36" y="516" class="mono foot">* Narrow i32/u32/u16 kernels lower on scalar GPRs with per-block batch call (AVX2 currently targets i64x8); rustc -O3 auto-vectorizes u32/u16 with SSE2.</text>
</svg>
