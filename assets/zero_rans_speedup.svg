<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="zero-cc 4,979-LOC Direct ELF64 AVX2 vs rustc -O3 latency on 6 zero-rans kernels">
  <defs>
    <linearGradient id="gZcc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D48A"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>
    <linearGradient id="gRust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { fill: #F8FAFC; font-size: 17.5px; font-weight: 700; }
      .sub { fill: #94A3B8; font-size: 11px; }
      .winSum { fill: #00F5A0; font-size: 11px; font-weight: 700; text-anchor: end; }
      .kname { fill: #E2E8F0; font-size: 12.5px; font-weight: 700; }
      .kmeta { fill: #64748B; font-size: 10.5px; }
      .valR { fill: #7DD3FC; font-size: 11px; font-weight: 600; }
      .valZ { fill: #34D399; font-size: 11px; font-weight: 700; }
      .tick { fill: #64748B; font-size: 10.5px; text-anchor: middle; }
      .badgeWin { fill: #00F5A0; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .pill { fill: #CBD5E1; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
      .foot { fill: #64748B; font-size: 10px; }
    </style>
  </defs>

  <rect width="980" height="560" fill="#07090E"/>
  <rect x="16" y="16" width="948" height="528" rx="14" fill="#0F141F" stroke="#1E293B" stroke-width="1.5"/>

  <text x="36" y="44" class="mono title">zero-cc (4,979 LOC) Direct ELF64 AVX2 vs rustc -O3 on zero-rans</text>
  <text x="36" y="65" class="mono sub">AMD Ryzen 9 3900X | rustc 1.91.0 -C opt-level=3 | 131,072 calls/trial (median of 9) | Lower ns/call is faster</text>

  <rect x="36" y="77" width="12" height="12" rx="2" fill="url(#gZcc)"/>
  <text x="54" y="87" class="mono sub">zero-cc Direct ELF64 (AVX2)</text>
  <rect x="276" y="77" width="12" height="12" rx="2" fill="url(#gRust)"/>
  <text x="294" y="87" class="mono sub">rustc -O3 (LLVM)</text>
  <text x="944" y="87" class="mono winSum">6/6 kernels faster (1.25x - 2.43x)</text>

  <line x1="36" y1="100" x2="944" y2="100" stroke="#1E293B" stroke-width="1"/>

  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="3,4">
    <line x1="250" y1="112" x2="250" y2="458"/>
    <line x1="350" y1="112" x2="350" y2="458"/>
    <line x1="450" y1="112" x2="450" y2="458"/>
    <line x1="550" y1="112" x2="550" y2="458"/>
    <line x1="650" y1="112" x2="650" y2="458"/>
    <line x1="750" y1="112" x2="750" y2="458"/>
  </g>
  <line x1="250" y1="112" x2="250" y2="458" stroke="#334155" stroke-width="1.5"/>

  <!-- Row 0: idct8_1d_combine -->
  <text x="36" y="134" class="mono kname">idct8_1d_combine</text>
  <text x="36" y="150" class="mono kmeta">181-&gt;17 ops | AVX2 4x64</text>
  <rect x="250" y="120" width="470.5" height="14" rx="3" fill="url(#gRust)"/>
  <text x="729" y="131" class="mono valR">9.41 ns</text>
  <rect x="250" y="138" width="193.5" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="452" y="149" class="mono valZ">3.87 ns</text>
  <rect x="816" y="123" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="140" class="mono badgeWin">2.43x faster</text>

  <!-- Row 1: dct8_1d_odd -->
  <text x="36" y="190" class="mono kname">dct8_1d_odd</text>
  <text x="36" y="206" class="mono kmeta">101-&gt;53 ops | AVX2 4x64</text>
  <rect x="250" y="176" width="325.5" height="14" rx="3" fill="url(#gRust)"/>
  <text x="584" y="187" class="mono valR">6.51 ns</text>
  <rect x="250" y="194" width="152.0" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="410" y="205" class="mono valZ">3.04 ns</text>
  <rect x="816" y="179" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="196" class="mono badgeWin">2.14x faster</text>

  <!-- Row 2: idct8_1d_odd -->
  <text x="36" y="246" class="mono kname">idct8_1d_odd</text>
  <text x="36" y="262" class="mono kmeta">93-&gt;71 ops | /289 AVX2</text>
  <rect x="250" y="232" width="390.0" height="14" rx="3" fill="url(#gRust)"/>
  <text x="648" y="243" class="mono valR">7.80 ns</text>
  <rect x="250" y="250" width="197.5" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="456" y="261" class="mono valZ">3.95 ns</text>
  <rect x="816" y="235" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="252" class="mono badgeWin">1.98x faster</text>

  <!-- Row 3: idct8_1d_even -->
  <text x="36" y="302" class="mono kname">idct8_1d_even</text>
  <text x="36" y="318" class="mono kmeta">49-&gt;37 ops | /29 AVX2</text>
  <rect x="250" y="288" width="165.0" height="14" rx="3" fill="url(#gRust)"/>
  <text x="423" y="299" class="mono valR">3.30 ns</text>
  <rect x="250" y="306" width="102.5" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="361" y="317" class="mono valZ">2.05 ns</text>
  <rect x="816" y="291" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="308" class="mono badgeWin">1.61x faster</text>

  <!-- Row 4: dct8_1d_even -->
  <text x="36" y="358" class="mono kname">dct8_1d_even</text>
  <text x="36" y="374" class="mono kmeta">77-&gt;31 ops | AVX2 4x64</text>
  <rect x="250" y="344" width="267.5" height="14" rx="3" fill="url(#gRust)"/>
  <text x="526" y="355" class="mono valR">5.35 ns</text>
  <rect x="250" y="362" width="177.0" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="435" y="373" class="mono valZ">3.54 ns</text>
  <rect x="816" y="347" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="364" class="mono badgeWin">1.51x faster</text>

  <!-- Row 5: rans_refill_branchless -->
  <text x="36" y="414" class="mono kname">rans_refill_branchless</text>
  <text x="36" y="430" class="mono kmeta">185-&gt;67 ops | AVX2 8x32</text>
  <rect x="250" y="400" width="172.5" height="14" rx="3" fill="url(#gRust)"/>
  <text x="431" y="411" class="mono valR">3.45 ns</text>
  <rect x="250" y="418" width="138.0" height="14" rx="3" fill="url(#gZcc)"/>
  <text x="396" y="429" class="mono valZ">2.76 ns</text>
  <rect x="816" y="403" width="128" height="26" rx="6" fill="#052E23" stroke="#00F5A0" stroke-width="1"/>
  <text x="880" y="420" class="mono badgeWin">1.25x faster</text>

  <!-- X-axis ticks -->
  <text x="250" y="474" class="mono tick">0 ns</text>
  <text x="350" y="474" class="mono tick">2 ns</text>
  <text x="450" y="474" class="mono tick">4 ns</text>
  <text x="550" y="474" class="mono tick">6 ns</text>
  <text x="650" y="474" class="mono tick">8 ns</text>
  <text x="750" y="474" class="mono tick">10 ns</text>

  <!-- Footer Verification Badges -->
  <line x1="36" y1="486" x2="944" y2="486" stroke="#1E293B" stroke-width="1"/>
  <rect x="36" y="494" width="196" height="22" rx="5" fill="#111827" stroke="#00F5A0"/>
  <text x="134" y="509" class="mono pill">4,979 LOC | 0 crates</text>
  <rect x="244" y="494" width="242" height="22" rx="5" fill="#111827" stroke="#334155"/>
  <text x="365" y="509" class="mono pill">25/25 tests | 100k+ UB fuzz</text>
  <rect x="498" y="494" width="224" height="22" rx="5" fill="#111827" stroke="#334155"/>
  <text x="610" y="509" class="mono pill">28 proven fns | 0 spills</text>
  <rect x="734" y="494" width="210" height="22" rx="5" fill="#111827" stroke="#00F5A0"/>
  <text x="839" y="509" class="mono pill">100.0% Direct ET_EXEC</text>

  <text x="36" y="533" class="mono foot">All 6 kernels compile straight from unmodified zero-rans .rs to AVX2 ELF64 (0 idiv, 0 spills, 59/59 crate kernels compiled).</text>
</svg>
